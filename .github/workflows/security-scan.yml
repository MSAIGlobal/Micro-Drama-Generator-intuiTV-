# Cyber Essentials: Secure Configuration + Security Update Management.
# Portable security gate that runs on every push and pull request without
# requiring GitHub Advanced Security. Blocks on leaked secrets (gitleaks).
# SAST (Semgrep OSS) and dependency audit are advisory during rollout so the
# first pass does not hard-block on pre-existing findings; promote each to
# blocking (remove the trailing `|| echo`) once the backlog is triaged.
name: Security Scan
on:
  push:
    branches: [main, master, "claude/**"]
  pull_request: {}
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-git --redact --no-banner --verbose \
            --config /repo/.gitleaks.toml

  sast:
    name: Static analysis (Semgrep OSS)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Semgrep scan (advisory during rollout; promote to blocking once triaged)
        run: |
          semgrep scan --severity ERROR \
            --config p/security-audit --config p/secrets --config p/owasp-top-ten \
            || echo "::warning::Semgrep reported ERROR-severity findings — triage and fix, then remove the trailing '|| echo' in security-scan.yml to make this blocking"

  dependency-audit:
    name: Dependency vulnerability audit (advisory)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        if: ${{ hashFiles('**/package-lock.json', '**/yarn.lock', '**/pnpm-lock.yaml') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Setup Python
        if: ${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/Pipfile') != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Node dependency audit (advisory)
        if: ${{ hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json', '**/yarn.lock', '**/pnpm-lock.yaml') != '' }}
        shell: bash
        run: |
          npm audit --audit-level=critical || echo "::warning::npm audit reported advisories (advisory, non-blocking)"
      - name: Python dependency audit (advisory)
        shell: bash
        run: |
          python -m pip install --quiet pip-audit || true
          pip-audit || echo "::warning::pip-audit reported advisories (advisory, non-blocking)"
