# gitleaks configuration — Cyber Essentials secret hygiene.
# Extends the upstream default ruleset. The blocking CI gate scans the current
# working tree (--no-git); historical secrets are handled by the remediation
# runbook, not by blocking every pull request.
title = "MSAI gitleaks config"

[extend]
useDefault = true

# Allowlist: documentation placeholders and known-pending secret files.
# Add project-specific entries ONLY for verified false positives.
[allowlist]
description = "Doc placeholders + known committed secret files pending rotation/purge"
regexTarget = "match"
regexes = [
  '''(?i)(your[_-]?(msai[_-]?)?(api[_-]?)?(key|token|secret))''',
  '''(?i)(example|placeholder|dummy|sample|changeme|redacted|test[_-]?key|fake[_-]?)''',
  '''(?i)bearer\s+your[_-]''',
  '''(?i)<[a-z0-9_.-]+>''',
  '''(?i)(xxx+|\*\*\*+)''',
]
